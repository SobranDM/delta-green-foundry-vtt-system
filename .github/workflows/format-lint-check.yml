name: Format & Lint Check

on:
  pull_request:
    branches:
      - master
      - hotfix/**

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node Setup
        uses: ./.github/actions/setup-node # Set the folder

      - name: Run ESLint
        run: pnpm run lint

  format:
    name: Run Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node Setup
        uses: ./.github/actions/setup-node # Set the folder

      - name: Check Prettier formatting
        run: pnpm run format:check

  sass:
    name: Compile Sass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node Setup
        uses: ./.github/actions/setup-node

      - name: Compile Sass
        run: pnpm run build:css

defaults:
  run:
    shell: bash
